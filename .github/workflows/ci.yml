name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Baked into the binary at compile time (see src-tauri/build.rs).
      # Optional: when unset, the app builds with sign-in disabled.
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend deps
        run: cd ui && npm ci

      - name: Build frontend
        run: cd ui && npm run build

      - name: Cargo check
        run: cd src-tauri && cargo check --all-targets

      - name: Cargo clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cd src-tauri && cargo test --all-targets

  build-appimage:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Baked into the shipped binary at compile time (see src-tauri/build.rs).
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend deps
        run: cd ui && npm ci

      # tauri-bundler downloads AppRun at bundle time. A GitHub 504 there fails
      # the whole job even though the build succeeded, so cache the tools and
      # retry the download explicitly.
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-tools-${{ runner.os }}-v1

      - name: Pre-fetch AppImage AppRun
        run: |
          set -euo pipefail
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$dir"
          if [ -s "$dir/AppRun-x86_64" ]; then
            echo "AppRun already cached"
            exit 0
          fi
          curl --fail --location \
            --retry 10 --retry-delay 5 --retry-all-errors \
            --output "$dir/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod +x "$dir/AppRun-x86_64"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --bundles appimage,deb,rpm
